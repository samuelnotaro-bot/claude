services:
  - type: web
    name: mkweb-piwik-pro-analyzer-v1
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    disk:
      name: piwik-trends-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PIWIK_MODE
        value: live
      - key: PIWIK_BASE_URL
        sync: false
      - key: PIWIK_CLIENT_ID
        sync: false
      - key: PIWIK_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/piwik-trends.db
      - key: BACKFILL_DAYS
        value: "90"
      - key: FETCH_CRON
        value: "0 6 * * *"
      - key: SYNTHESIS_CRON
        value: "0 7 * * 1"
